name: Update Changelog

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Aplicación (novaplay, novapanel, killerplay)'
        required: true
        default: 'novaplay'
        type: choice
        options:
          - novaplay
          - novapanel
          - killerplay
      changelog_text:
        description: 'Nuevo contenido del changelog (ítems separados por saltos de línea)'
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updater repository
        uses: actions/checkout@v4
        with:
          repository: 'NovaplayGO/updater'
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Update JSON and Push
        run: |
          python3 -c "
          import json, datetime
          path = 'json/updatebeta.json'
          with open(path, 'r', encoding='utf-8') as f:
              data = json.load(f)
          
          items = [x.strip() for x in '''${{ github.event.inputs.changelog_text }}'''.split('\n') if x.strip()]
          if items:
              data['changelog'] = items
              data['texto'] = items[0]
              data['date'] = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
          
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=4, ensure_ascii=False)
          "
          
          git config --global user.name "NovaPlay Bot"
          git config --global user.email "bot@novaplay.py"
          git add json/updatebeta.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "APK Release generado desde Constructor [skip ci]" && git push)
