name: Build NovaPlay APK (Release)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variante de NovaPlay'
        required: true
        default: 'beta'
        type: choice
        options:
          - stable
          - beta

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Novaplay_code
        uses: actions/checkout@v4
        with:
          repository: 'NovaplayGO/Novaplay_code'
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Decode Keystore to Project Root
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :novaplay:assembleRelease

      - name: Checkout updater repository
        uses: actions/checkout@v4
        with:
          repository: 'NovaplayGO/updater'
          token: ${{ secrets.GH_PAT || github.token }}
          path: updater

      - name: Copy and Push APK to updater
        run: |
          mkdir -p updater/apks
          VARIANT="${{ github.event.inputs.variant || 'beta' }}"
          if [ "$VARIANT" = "stable" ]; then
            cp novaplay/build/outputs/apk/release/novaplay-release.apk updater/apks/novaplay.apk
            APK_NAME="novaplay.apk"
          else
            cp novaplay/build/outputs/apk/release/novaplay-release.apk updater/apks/novaplaybeta.apk
            APK_NAME="novaplaybeta.apk"
          fi
          cd updater
          git config --global user.name "NovaPlay Bot"
          git config --global user.email "bot@novaplay.py"
          git add apks/$APK_NAME
          git pull origin main --rebase || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "APK Release generado desde Constructor [skip ci]" && git push origin main)
