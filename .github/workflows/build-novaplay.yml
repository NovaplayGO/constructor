name: Build NovaPlay APK (Release)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variante de NovaPlay'
        required: true
        default: 'beta'
        type: choice
        options:
          - stable
          - beta

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Novaplay_code
        uses: actions/checkout@v4
        with:
          repository: 'NovaplayGO/Novaplay_code'
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Decode Keystore to Project Root
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :novaplay:assembleRelease

      - name: Checkout updater repository
        uses: actions/checkout@v4
        with:
          repository: 'NovaplayGO/updater'
          token: ${{ secrets.GH_PAT || github.token }}
          path: updater

      - name: Copy APK and Update JSON metadata
        run: |
          mkdir -p updater/apks
          VARIANT="${{ github.event.inputs.variant || 'beta' }}"
          if [ "$VARIANT" = "stable" ]; then
            cp novaplay/build/outputs/apk/release/novaplay-release.apk updater/apks/novaplay.apk
            APK_NAME="novaplay.apk"
            JSON_FILE="json/updatestable.json"
          else
            cp novaplay/build/outputs/apk/release/novaplay-release.apk updater/apks/novaplaybeta.apk
            APK_NAME="novaplaybeta.apk"
            JSON_FILE="json/updatebeta.json"
          fi
          
          cd updater
          python3 -c "
          import json, os, datetime
          json_file = '$JSON_FILE'
          apk_path = 'apks/$APK_NAME'
          
          if os.path.exists(apk_path):
              size_bytes = os.path.getsize(apk_path)
              size_mb = f'{size_bytes / (1024*1024):.1f} MB'
              utc_date = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
              
              if os.path.exists(json_file):
                  with open(json_file, 'r', encoding='utf-8') as f:
                      data = json.load(f)
              else:
                  data = {}
              
              data['size'] = size_mb
              data['date'] = utc_date
              
              with open(json_file, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=4, ensure_ascii=False)
          "
          
          git config --global user.name "NovaPlay Bot"
          git config --global user.email "bot@novaplay.py"
          git add apks/$APK_NAME json/
          git pull origin main --rebase || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "APK Release generado desde Constructor [skip ci]" && git push origin main)
