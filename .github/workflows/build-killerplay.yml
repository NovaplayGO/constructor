name: Build KillerPlay APK (Release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Novaplay_code
        uses: actions/checkout@v4
        with:
          repository: 'NovaplayGO/Novaplay_code'
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Decode Keystore to Project Root
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :killerplay:assembleRelease

      - name: Checkout updater repository
        uses: actions/checkout@v4
        with:
          repository: 'NovaplayGO/updater'
          token: ${{ secrets.GH_PAT || github.token }}
          path: updater

      - name: Copy APK and Update JSON metadata
        run: |
          mkdir -p updater/json/ms_aux
          cp killerplay/build/outputs/apk/release/killerplay-release.apk updater/json/ms_aux/killerplay.apk
          
          cd updater
          python3 -c "
          import json, os, datetime
          json_file = 'json/updateplay.json'
          apk_path = 'json/ms_aux/killerplay.apk'
          
          if os.path.exists(apk_path):
              size_bytes = os.path.getsize(apk_path)
              size_mb = f'{size_bytes / (1024*1024):.1f} MB'
              utc_date = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
              
              if os.path.exists(json_file):
                  with open(json_file, 'r', encoding='utf-8') as f:
                      data = json.load(f)
              else:
                  data = {}
              
              data['size'] = size_mb
              data['date'] = utc_date
              
              with open(json_file, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=4, ensure_ascii=False)
          "
          
          git config --global user.name "NovaPlay Bot"
          git config --global user.email "bot@novaplay.py"
          git add json/ms_aux/killerplay.apk json/
          git pull origin main --rebase || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "ACTUALIZADO DESDE CONSTRUCTOR [skip ci]" && git push origin main)

      - name: Checkout NovaApps repository and Sync app_data.json
        uses: actions/checkout@v4
        with:
          repository: 'NovaplayGO/NovaApps'
          token: ${{ secrets.GH_PAT || github.token }}
          path: novaapps

      - name: Update NovaApps app_data.json
        run: |
          cd novaapps
          python3 -c "
          import json, os, datetime
          try:
              with open('../updater/json/updatestable.json', 'r', encoding='utf-8') as f:
                  stable = json.load(f)
              with open('../updater/json/updatebeta.json', 'r', encoding='utf-8') as f:
                  beta = json.load(f)
              with open('../updater/json/ms_aux/updateplay.json', 'r', encoding='utf-8') as f:
                  killer = json.load(f)
              
              app_data = {
                  'stable': {'version': stable.get('version'), 'size': stable.get('size'), 'date': stable.get('date', datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'))},
                  'beta': {'version': beta.get('version'), 'size': beta.get('size'), 'date': beta.get('date', datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'))},
                  'killer': {'version': killer.get('version'), 'size': killer.get('size'), 'date': killer.get('date', datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'))}
              }
              
              with open('app_data.json', 'w', encoding='utf-8') as f:
                  json.dump(app_data, f, indent=2, ensure_ascii=False)
          except Exception as e:
              print('Error:', e)
          "
          git config --global user.name "NovaPlay Bot"
          git config --global user.email "bot@novaplay.py"
          git add app_data.json
          git pull origin main --rebase || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "ACTUALIZADO DESDE CONSTRUCTOR" && git push origin main)
