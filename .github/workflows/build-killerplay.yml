name: Build KillerPlay APK (Release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Novaplay_code
        uses: actions/checkout@v4
        with:
          repository: 'NovaplayGO/Novaplay_code'
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Decode Keystore to Project Root
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :killerplay:assembleRelease

      - name: Checkout updater repository
        uses: actions/checkout@v4
        with:
          repository: 'NovaplayGO/updater'
          token: ${{ secrets.GH_PAT || github.token }}
          path: updater

      - name: Copy and Push APK to updater
        run: |
          mkdir -p updater/json/ms_aux
          cp killerplay/build/outputs/apk/release/killerplay-release.apk updater/json/ms_aux/killerplay.apk
          cd updater
          git config --global user.name "NovaPlay Bot"
          git config --global user.email "bot@novaplay.py"
          git add json/ms_aux/killerplay.apk
          git pull origin main --rebase || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Actualizar killerplay.apk en json/ms_aux desde el Constructor [skip ci]" && git push origin main)
